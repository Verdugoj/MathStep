    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración real de tu proyecto en Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBXLeHfvxcVo-lvNpEHjf0vjfgjRJp4aYg",
            authDomain: "mathstep-escuela.firebaseapp.com",
            projectId: "mathstep-escuela",
            storageBucket: "mathstep-escuela.firebasestorage.app",
            messagingSenderId: "447399870290",
            appId: "1:447399870290:web:695f170cf9fcd5ea64848b"
        };

        const appId = 'mathstep-escuela';

        let db, auth;
        window.isCloudReady = false;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            signInAnonymously(auth).then((cred) => {
                window.isCloudReady = true;
                console.log("✅ Conectado a la Nube (Firebase) correctamente.");
            }).catch(e => {
                if (e.code === 'auth/configuration-not-found') {
                    console.warn("⚠️ FIREBASE AUTH APAGADO: Habilita 'Anónimo' en Firebase. Usando almacenamiento local por ahora.");
                } else {
                    console.warn("⚠️ Error de permisos en la nube. Usando almacenamiento local por ahora.", e);
                }
            });
        } catch(e) {
            console.warn("⚠️ No se pudo iniciar Firebase. Revisa la configuración. Usando almacenamiento local.", e);
        }

        window.cloudDB = {
            async saveProgress(expediente, data) {
                if (!window.isCloudReady || !db) return;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', expediente);
                    await setDoc(docRef, data, { merge: true });
                    console.log("💾 Progreso guardado en internet.");
                } catch(e) { console.warn("Error guardando en la nube:", e); }
            },
            async loadProgress(expediente) {
                if (!window.isCloudReady || !db) return null;
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', expediente);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        console.log("☁️ Datos descargados de internet.");
                        return docSnap.data();
                    }
                    return null;
                } catch(e) { console.warn("Error leyendo de la nube:", e); return null; }
            }
        };
    </script>

    <!-- Generación del PWA Manifest Dinámico (Icono de Matemáticas) -->
    <script>
        const manifestStr = `{
            "name": "MathStep Cloud",
            "short_name": "MathStep",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#F8FAFC",
            "theme_color": "#4F46E5",
            "icons": [{
                "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='url(%23g)'/><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%237C3AED'/><stop offset='100%' stop-color='%234F46E5'/></linearGradient></defs><path d='M150 350 L200 350 L250 150 L380 150' fill='none' stroke='white' stroke-width='40' stroke-linecap='round' stroke-linejoin='round'/><circle cx='250' cy='250' r='120' fill='none' stroke='rgba(255,255,255,0.2)' stroke-width='20'/></svg>",
                "sizes": "512x512",
                "type": "image/svg+xml",
                "purpose": "any maskable"
            }]
        }`;
        const blob = new Blob([manifestStr], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        document.write(`<link rel="manifest" href="${manifestURL}">`);
    </script>

    <!-- Registro del Service Worker Antiguo para DESTRUIRLO y limpiar caché -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for(let registration of registrations) {
                    registration.unregister().then(function(boolean) {
                        console.log("Service Worker viejo eliminado para limpiar caché.");
                    });
                }
            }).catch(function(error) {
                console.warn("⚠️ Entorno seguro/sandbox: No se requiere limpiar Service Workers aquí.", error);
            });
        }
    </script>

    <script>
        // --- 1. CONFIGURACIÓN Y ESTADO ---
        lucide.createIcons();
        let selectedAvatar = '🧑‍🎓';
        
        let studentData = {
            expediente: '', nombre: '', apPaterno: '', apMaterno: '', grupo: '', avatar: '🧑‍🎓',
            puntos: 0, racha: 0, resueltos: 0, stats: {}
        };
        
        let currentState = {
            topic: 'col_mul', difficulty: 'facil',
            steps: [], stepIndex: 0, data: {}
        };

        // --- 2. GESTIÓN DE USUARIOS (Login/Registro) ---
        function selectAvatar(el, avatar) {
            selectedAvatar = avatar;
            document.querySelectorAll('#avatarSelector div').forEach(d => {
                d.className = 'cursor-pointer text-2xl p-2 rounded-xl bg-slate-50 border-2 border-transparent hover:bg-slate-100';
            });
            el.className = 'cursor-pointer text-2xl p-2 rounded-xl bg-indigo-100 border-2 border-indigo-500';
        }

        document.getElementById('expedienteInput').addEventListener('input', function(e) {
            const val = e.target.value;
            const regForm = document.getElementById('registerForm');
            const btn = document.getElementById('authBtn');
            
            // Simular búsqueda local rápida para mostrar u ocultar registro
            const isLocalKnown = localStorage.getItem('math_student_' + val) !== null;
            
            if (val.length === 8 && !isLocalKnown) {
                regForm.classList.remove('hidden');
                btn.innerText = 'Registrar y Guardar en la Nube';
            } else {
                regForm.classList.add('hidden');
                btn.innerText = 'Ingresar a la Nube';
            }
        });

        async function handleAuthSubmit() {
            const exp = document.getElementById('expedienteInput').value.trim();
            if (exp.length !== 8) { alert("El expediente debe tener 8 dígitos."); return; }

            const btn = document.getElementById('authBtn');
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>';
            lucide.createIcons();

            let savedData = null;
            if (window.cloudDB) savedData = await window.cloudDB.loadProgress(exp);
            if (!savedData) savedData = JSON.parse(localStorage.getItem('math_student_' + exp));

            if (savedData) {
                studentData = savedData;
            } else {
                studentData = {
                    expediente: exp,
                    apPaterno: document.getElementById('apPaternoInput').value.trim(),
                    apMaterno: document.getElementById('apMaternoInput').value.trim(),
                    nombre: document.getElementById('nombreInput').value.trim(),
                    grupo: document.getElementById('grupoInput').value.trim(),
                    avatar: selectedAvatar,
                    puntos: 0, racha: 0, resueltos: 0, stats: {}
                };
            }

            document.getElementById('loginModal').classList.add('hidden');
            actualizarUIEstudiante();
            initProblem();
        }

        function cerrarSesion() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('expedienteInput').value = '';
            document.getElementById('registerForm').classList.add('hidden');
        }

        function guardarProgreso() {
            localStorage.setItem('math_student_' + studentData.expediente, JSON.stringify(studentData));
            if (window.cloudDB) window.cloudDB.saveProgress(studentData.expediente, studentData);
        }

        function actualizarUIEstudiante() {
            document.getElementById('userNameDisplay').innerText = studentData.nombre || studentData.expediente;
            document.getElementById('userAvatarDisplay').innerText = studentData.avatar || '🧑‍🎓';
            document.getElementById('totalPoints').innerText = studentData.puntos + ' pts';
            document.getElementById('streakCount').innerText = studentData.racha;
        }

        // --- 3. UI Y NAVEGACIÓN ---
        function setDifficulty(diff) {
            currentState.difficulty = diff;
            const bg = document.getElementById('diffBgSelector');
            const btnFacil = document.getElementById('diff-facil');
            const btnMedio = document.getElementById('diff-medio');
            const btnReto = document.getElementById('diff-reto');

            btnFacil.className = 'flex-1 py-2 text-sm font-bold z-10 transition-colors text-slate-500';
            btnMedio.className = 'flex-1 py-2 text-sm font-bold z-10 transition-colors text-slate-500';
            btnReto.className = 'flex-1 py-2 text-sm font-bold z-10 transition-colors text-slate-500';

            if(diff === 'facil') {
                bg.style.left = '1.5%'; bg.style.width = '31%';
                bg.className = 'absolute top-1.5 bottom-1.5 bg-green-100 border-2 border-green-200 rounded-xl transition-all duration-300 z-0';
                btnFacil.classList.replace('text-slate-500', 'text-green-700');
            } else if (diff === 'medio') {
                bg.style.left = '34%'; bg.style.width = '32%';
                bg.className = 'absolute top-1.5 bottom-1.5 bg-amber-100 border-2 border-amber-200 rounded-xl transition-all duration-300 z-0';
                btnMedio.classList.replace('text-slate-500', 'text-amber-700');
            } else {
                bg.style.left = '67.5%'; bg.style.width = '31%';
                bg.className = 'absolute top-1.5 bottom-1.5 bg-rose-100 border-2 border-rose-200 rounded-xl transition-all duration-300 z-0';
                btnReto.classList.replace('text-slate-500', 'text-rose-700');
            }
            updateHeaderUI();
            initProblem();
        }

        function setTopic(topic) {
            currentState.topic = topic;
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.className = 'menu-btn w-full flex items-center gap-3 p-2.5 rounded-xl transition-all font-medium text-left text-slate-600 hover:bg-slate-50';
                let iconDiv = btn.querySelector('.icon-bg');
                if(iconDiv) iconDiv.className = 'icon-bg w-8 h-8 rounded-lg flex items-center justify-center bg-slate-100 text-slate-500';
            });
            
            const activeBtn = document.getElementById('btn-' + topic);
            if(activeBtn) {
                activeBtn.className = 'menu-btn active w-full flex items-center gap-3 p-2.5 rounded-xl transition-all font-medium text-left bg-indigo-600 text-white shadow-md shadow-indigo-200';
                let iconDiv = activeBtn.querySelector('.icon-bg');
                if(iconDiv) iconDiv.className = 'icon-bg w-8 h-8 rounded-lg flex items-center justify-center bg-white/20 text-white';
            }
            updateHeaderUI();
            initProblem();
        }

        function updateHeaderUI() {
            let pts = currentState.difficulty === 'facil' ? '+1 pt' : (currentState.difficulty === 'medio' ? '+2 pts' : '+3 pts');
            let badge = document.getElementById('currentDiffBadge');
            badge.innerText = `${currentState.difficulty.toUpperCase()} ${pts}`;
            
            if(currentState.difficulty === 'facil') badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-md bg-green-100 text-green-800 uppercase tracking-wide border border-green-200';
            if(currentState.difficulty === 'medio') badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 uppercase tracking-wide border border-amber-200';
            if(currentState.difficulty === 'reto') badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-md bg-rose-100 text-rose-800 uppercase tracking-wide border border-rose-200';
        }

        // --- 4. MOTORES DE GENERACIÓN MATEMÁTICA ---
        const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const primes = [2, 3, 5, 7, 11, 13, 17, 19];
        const mcdCalc = (a, b) => b === 0 ? a : mcdCalc(b, a % b);

        function initProblem() {
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('inputContainer').classList.remove('hidden');
            const input = document.getElementById('answerInput');
            input.value = ''; input.disabled = false; input.focus();

            currentState.stepIndex = 0;
            currentState.steps = [];
            currentState.data = {};
            
            if(currentState.topic === 'col_mul') genColMul();
            else if(currentState.topic === 'col_div') genColDiv();
            else if(currentState.topic === 'primos') genPrimos();
            else if(currentState.topic === 'mcd') genMCD();
            else if(currentState.topic === 'mcm') genMCM();
            else if(currentState.topic.startsWith('frac_')) genFracciones();
            
            renderStep();
        }

        // --- A. MULTIPLICACIÓN: Dígito por Dígito con acarreos ---
        function genColMul() {
            let n1 = currentState.difficulty === 'facil' ? rand(12, 99) : rand(100, 999);
            let n2 = currentState.difficulty === 'reto' ? rand(12, 99) : rand(2, 9);
            
            let s1 = n1.toString(), s2 = n2.toString();
            let steps = [];
            
            currentState.data = { n1: s1, n2: s2, rows: [], finalAns: [], carries: Array(s1.length+1).fill(0) };

            for (let j = s2.length - 1; j >= 0; j--) {
                let multiplier = parseInt(s2[j]);
                let rowAns = Array(s1.length + (s2.length-1-j)).fill(''); // zeros de desplazamiento invisibles al inicio
                let carry = 0;
                
                for(let i = s1.length - 1; i >= 0; i--) {
                    let topDigit = parseInt(s1[i]);
                    let prod = (topDigit * multiplier) + carry;
                    let digitToPlace = prod % 10;
                    carry = Math.floor(prod / 10);
                    
                    steps.push({
                        type: 'mul_digit', rowIdx: s2.length - 1 - j, colIdx: i,
                        expected: digitToPlace, nextCarry: carry,
                        msg: `Multiplica ${topDigit} × ${multiplier} ${currentState.data.carries[i+1]>0 ? '+ acarreo' : ''}. ¿Qué número va abajo?`
                    });
                }
                if (carry > 0) {
                    steps.push({ type: 'mul_digit', rowIdx: s2.length - 1 - j, colIdx: -1, expected: carry, nextCarry: 0, msg: `Coloca el acarreo final.` });
                }
                currentState.data.rows.push(rowAns);
            }

            if (s2.length > 1) {
                let finalRes = (n1 * n2).toString();
                currentState.data.finalAns = Array(finalRes.length).fill('');
                for(let i=finalRes.length-1; i>=0; i--) {
                    steps.push({ type: 'add_final', colIdx: i, expected: parseInt(finalRes[i]), msg: `Suma las columnas. ¿Dígito final?` });
                }
            }
            currentState.steps = steps;
        }

        // --- B. DIVISIÓN: Cociente y luego Residuo ---
        function genColDiv() {
            let div = currentState.difficulty === 'reto' ? rand(11, 25) : rand(2, 9);
            let quo = currentState.difficulty === 'facil' ? rand(12, 49) : rand(105, 999);
            let dividend = div * quo + rand(0, div - 1);
            let divStr = dividend.toString();
            
            let steps = [];
            currentState.data = { div, dividend: divStr, qArr: Array(divStr.length).fill(''), residues: [], curDivVal: 0 };

            let currentDiv = parseInt(divStr[0]);
            let idx = 0;
            if (currentDiv < div) { currentDiv = parseInt(divStr[0] + divStr[1]); idx = 1; }

            while(idx < divStr.length) {
                let q = Math.floor(currentDiv / div);
                let rem = currentDiv % div;
                
                steps.push({ type: 'quo', expected: q, qIdx: idx, val: currentDiv, msg: `¿Cuántas veces cabe ${div} en ${currentDiv}?` });
                steps.push({ type: 'rem', expected: rem, qIdx: idx, val: currentDiv, sub: q*div, msg: `Resta ${q*div} a ${currentDiv}. ¿Cuál es el residuo?` });
                
                idx++;
                if (idx < divStr.length) {
                    currentDiv = parseInt(rem.toString() + divStr[idx]);
                }
            }
            currentState.steps = steps;
        }

        // --- C. FACTORES PRIMOS: Adivinar Primo -> Adivinar División ---
        function genPrimos() {
            let num = currentState.difficulty === 'facil' ? rand(12, 40) : rand(50, 150);
            while(primes.includes(num)) num++; 
            
            let temp = num, steps = [], row = 0;
            currentState.data = { grid: [{ left: num, right: '?' }] };

            while(temp > 1) {
                let p = primes.find(x => temp % x === 0) || temp;
                steps.push({ type: 'prime', expected: p, row: row, msg: `¿Cuál es el número primo MENOR (2,3,5...) que divide a ${temp}?` });
                temp /= p;
                steps.push({ type: 'quotient', expected: temp, row: row, msg: `¿Cuánto es la mitad/tercia/etc de ${temp*p}?` });
                row++;
            }
            currentState.steps = steps;
        }

        // --- D. MCD / MCM: Formato Escalera Vertical ---
        function genMCD() {
            let a = rand(12, 36), b = rand(12, 36);
            if(a===b) b+=2;
            let tempA = a, tempB = b, steps = [], row = 0, factors = [];
            currentState.data = { title: `MCD(${a}, ${b})`, grid: [{ c1: a, c2: b, p: '?' }] };

            while(true) {
                let p = primes.find(x => tempA % x === 0 && tempB % x === 0);
                if(!p) break;
                factors.push(p);
                steps.push({ type: 'prime', expected: p, row: row, msg: `¿Qué primo divide a AMBOS (${tempA} y ${tempB})?` });
                tempA /= p; tempB /= p;
                steps.push({ type: 'q1', expected: tempA, row: row, msg: `Divide ${tempA*p} entre ${p}.` });
                steps.push({ type: 'q2', expected: tempB, row: row, msg: `Divide ${tempB*p} entre ${p}.` });
                row++;
                currentState.data.grid.push({ c1: tempA, c2: tempB, p: '?' });
            }
            currentState.data.grid[row].p = ''; // No more common primes
            
            let ans = factors.reduce((x,y)=>x*y, 1);
            if(factors.length > 0) steps.push({ type: 'final', expected: ans, msg: `Multiplica los factores comunes: ${factors.join(' × ')}` });
            else steps.push({ type: 'final', expected: 1, msg: `No hay comunes. El MCD es 1.` });
            
            currentState.steps = steps;
        }

        function genMCM() {
            let a = rand(6, 20), b = rand(6, 20);
            let tempA = a, tempB = b, steps = [], row = 0, factors = [];
            currentState.data = { title: `mcm(${a}, ${b})`, grid: [{ c1: a, c2: b, p: '?' }] };

            while(tempA > 1 || tempB > 1) {
                let p = primes.find(x => tempA % x === 0 || tempB % x === 0);
                factors.push(p);
                steps.push({ type: 'prime', expected: p, row: row, msg: `¿Qué primo divide a ALGUNO de los dos?` });
                if(tempA%p===0) tempA/=p;
                steps.push({ type: 'q1', expected: tempA, row: row, msg: `Divide o baja el número igual.` });
                if(tempB%p===0) tempB/=p;
                steps.push({ type: 'q2', expected: tempB, row: row, msg: `Divide o baja el número igual.` });
                row++;
                if(tempA > 1 || tempB > 1) currentState.data.grid.push({ c1: tempA, c2: tempB, p: '?' });
            }
            let ans = factors.reduce((x,y)=>x*y, 1);
            steps.push({ type: 'final', expected: ans, msg: `Multiplica todos los primos de la derecha.` });
            currentState.steps = steps;
        }

        // --- E. FRACCIONES ---
        function genFracciones() {
            let d1 = rand(2, 6), d2 = rand(2, 6);
            let n1 = rand(1, 5), n2 = rand(1, 5);
            let steps = [];
            
            if (currentState.topic === 'frac_eq') {
                let m = rand(2,5);
                currentState.data = { n1, d1, n2: n1*m, d2: d1*m, missing: 'num' };
                steps = [{type:'eq', expected: n1*m, msg: 'Encuentra el numerador equivalente.'}];
            } else if (currentState.topic === 'frac_sum') {
                let df = (d1*d2)/mcdCalc(d1,d2);
                let nf = (n1*(df/d1)) + (n2*(df/d2));
                currentState.data = { n1, d1, n2, d2, nf, df };
                steps = [{type:'den', expected:df, msg:'Denominador común (mcm)'}, {type:'num', expected:nf, msg:'Suma de numeradores equivalentes'}];
            } else if (currentState.topic === 'frac_mul') {
                currentState.data = { n1, d1, n2, d2, nf: n1*n2, df: d1*d2 };
                steps = [{type:'num', expected:n1*n2, msg:'Multiplica directo arriba'}, {type:'den', expected:d1*d2, msg:'Multiplica directo abajo'}];
            } else if (currentState.topic === 'frac_div') {
                currentState.data = { n1, d1, n2, d2, nf: n1*d2, df: d1*n2 };
                steps = [{type:'num', expected:n1*d2, msg:'Multiplica cruzado (n1 x d2)'}, {type:'den', expected:d1*n2, msg:'Multiplica cruzado (d1 x n2)'}];
            }
            currentState.steps = steps;
        }


        // --- 5. MOTOR DE RENDERIZADO VISUAL ---
        function renderStep() {
            const canvas = document.getElementById('mathCanvas');
            let d = currentState.data;
            let stepDef = currentState.steps[currentState.stepIndex];
            let html = '';

            // Barra de progreso y textos
            let pct = currentState.steps.length > 0 ? (currentState.stepIndex / currentState.steps.length)*100 : 100;
            document.getElementById('stepProgressBar').style.width = pct + '%';
            
            if (stepDef) {
                document.getElementById('instructionTitle').innerText = `Paso ${currentState.stepIndex + 1} de ${currentState.steps.length}`;
                document.getElementById('instructionDesc').innerText = stepDef.msg;
            }

            // RENDER: MULTIPLICACIÓN
            if (currentState.topic === 'col_mul') {
                html += `<div class="flex flex-col items-end font-mono text-4xl sm:text-5xl font-bold tracking-widest relative mt-4 sm:mt-8">`;
                
                // Acarreos Animados
                html += `<div class="flex h-8 sm:h-10 mb-2 text-lg sm:text-2xl">`;
                for(let i=0; i<d.carries.length; i++) {
                    html += `<div class="w-8 sm:w-12 text-center text-amber-500 font-black">${d.carries[i] > 0 ? `<span class="animate-pop-in inline-block bg-amber-100 rounded-full px-1 border border-amber-300">⬆️+${d.carries[i]}</span>` : '&nbsp;'}</div>`;
                }
                html += `</div>`;
                
                // Superior
                html += `<div class="flex"><div class="w-8 sm:w-12">&nbsp;</div>`;
                for(let char of d.n1) html += `<div class="w-8 sm:w-12 text-center">${char}</div>`;
                html += `</div>`;
                
                // Inferior
                html += `<div class="flex border-b-4 border-slate-800 pb-2 mb-2 relative">`;
                html += `<div class="absolute left-[-1.5rem] sm:left-[-2rem] text-indigo-600 top-1">×</div>`;
                for(let i=0; i<d.n1.length + 1 - d.n2.length; i++) html += `<div class="w-8 sm:w-12">&nbsp;</div>`;
                for(let char of d.n2) html += `<div class="w-8 sm:w-12 text-center text-indigo-900">${char}</div>`;
                html += `</div>`;

                // Filas parciales
                d.rows.forEach((rowArr, rowIdx) => {
                    html += `<div class="flex">`;
                    for(let i=0; i<rowArr.length; i++) {
                        let val = rowArr[i];
                        let isActive = (stepDef && stepDef.type === 'mul_digit' && stepDef.rowIdx === rowIdx && (stepDef.colIdx === i || (stepDef.colIdx === -1 && i===0)));
                        
                        if (val !== '') html += `<div class="w-8 sm:w-12 text-center text-emerald-600 glow-success animate-pop-in">${val}</div>`;
                        else if (isActive) html += `<div class="w-8 sm:w-12 text-center text-indigo-700 bg-indigo-50 rounded-xl target-highlight">?</div>`;
                        else html += `<div class="w-8 sm:w-12 text-center text-transparent">_</div>`;
                    }
                    html += `</div>`;
                });

                // Suma Final (si hay más de 1 dígito)
                if (d.n2.length > 1 && currentState.stepIndex >= d.rows.length * (d.n1.length + 1)) {
                    html += `<div class="flex border-t-4 border-slate-800 pt-2 mt-2">`;
                    for(let i=0; i<d.finalAns.length; i++) {
                        let val = d.finalAns[i];
                        let isActive = (stepDef && stepDef.type === 'add_final' && stepDef.colIdx === i);
                        if (val !== '') html += `<div class="w-8 sm:w-12 text-center text-emerald-600 font-black animate-pop-in">${val}</div>`;
                        else if (isActive) html += `<div class="w-8 sm:w-12 text-center text-indigo-700 bg-indigo-50 rounded-xl target-highlight">?</div>`;
                        else html += `<div class="w-8 sm:w-12 text-center text-transparent">_</div>`;
                    }
                    html += `</div>`;
                }
                html += `</div>`;
            }
            
            // RENDER: DIVISIÓN CASITA
            else if (currentState.topic === 'col_div') {
                html += `<div class="flex flex-col items-center font-mono text-3xl sm:text-4xl font-bold">`;
                
                // Cociente Arriba
                html += `<div class="flex ml-8 sm:ml-12 mb-1">`;
                for(let i=0; i<d.qArr.length; i++) {
                    let isActive = (stepDef && stepDef.type === 'quo' && stepDef.qIdx === i);
                    if (d.qArr[i] !== '') html += `<div class="w-8 sm:w-12 text-center text-emerald-600 glow-success animate-pop-in">${d.qArr[i]}</div>`;
                    else if (isActive) html += `<div class="w-8 sm:w-12 text-center text-indigo-700 bg-indigo-50 rounded-lg target-highlight">?</div>`;
                    else html += `<div class="w-8 sm:w-12 text-center text-transparent">_</div>`;
                }
                html += `</div>`;
                
                // Casita
                html += `<div class="flex items-center">`;
                html += `<div class="pr-2 sm:pr-3 text-slate-700">${d.div}</div>`;
                html += `<div class="border-l-4 border-t-4 border-slate-800 pl-1 sm:pl-2 pt-1 flex">`;
                for(let char of d.dividend) html += `<div class="w-8 sm:w-12 text-center text-slate-800">${char}</div>`;
                html += `</div></div>`;

                // Residuos y Restas
                html += `<div class="flex flex-col w-full ml-8 sm:ml-12 text-xl sm:text-2xl text-slate-500 items-start pl-[${d.curDivVal.toString().length * 1.5}rem]">`;
                d.residues.forEach((r, idx) => {
                    html += `<div class="text-rose-500 animate-pop-in mt-1">-${r.sub}</div>`;
                    html += `<div class="border-t-2 border-slate-400 text-emerald-600 font-bold mb-2 w-12 sm:w-16 text-right">${r.rem}</div>`;
                });
                
                if (stepDef && stepDef.type === 'rem') {
                    html += `<div class="text-rose-500 mt-1">-${stepDef.sub}</div>`;
                    html += `<div class="border-t-2 border-slate-400 text-indigo-700 bg-indigo-50 px-2 sm:px-4 py-1 rounded-xl target-highlight w-auto mt-1">Resta = ?</div>`;
                }
                html += `</div></div>`;
            }

            // RENDER: FACTORES PRIMOS Y MCD/MCM (Mismo formato escalera)
            else if (currentState.topic === 'primos' || currentState.topic === 'mcd' || currentState.topic === 'mcm') {
                if (d.title) html += `<div class="text-lg sm:text-xl font-bold text-slate-400 mb-4 sm:mb-6 bg-slate-100 px-4 py-1 rounded-full">${d.title}</div>`;
                
                html += `<div class="flex font-mono text-3xl sm:text-4xl font-bold bg-white p-4 sm:p-6 rounded-3xl border-2 border-slate-100 shadow-sm w-full max-w-full overflow-x-auto justify-center">`;
                
                // Columna(s) Izquierda
                html += `<div class="flex flex-col items-end pr-4 sm:pr-6 border-r-4 border-slate-800">`;
                d.grid.forEach((row, i) => {
                    let isActQ1 = (stepDef && (stepDef.type === 'quotient' || stepDef.type === 'q1') && stepDef.row === i);
                    let isActQ2 = (stepDef && stepDef.type === 'q2' && stepDef.row === i);
                    
                    html += `<div class="py-2 flex gap-3 sm:gap-6 items-center">`;
                    if (row.left !== undefined) {
                        html += isActQ1 ? `<div class="text-indigo-700 target-highlight px-2 sm:px-3 rounded-lg">?</div>` : `<div class="text-slate-800">${row.left}</div>`;
                    } else {
                        html += isActQ1 ? `<div class="text-indigo-700 target-highlight px-2 sm:px-3 rounded-lg">?</div>` : `<div class="text-slate-800">${row.c1}</div>`;
                        html += `<div class="text-slate-300 text-xl sm:text-2xl">-</div>`;
                        html += isActQ2 ? `<div class="text-indigo-700 target-highlight px-2 sm:px-3 rounded-lg">?</div>` : `<div class="text-slate-800">${row.c2}</div>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
                
                // Columna Derecha (Primos)
                html += `<div class="flex flex-col items-center pl-4 sm:pl-6">`;
                d.grid.forEach((row, i) => {
                    let pVal = row.right || row.p;
                    let isActive = (stepDef && stepDef.type === 'prime' && stepDef.row === i);
                    if (pVal !== '?' && pVal !== '') html += `<div class="py-2 text-emerald-600 glow-success animate-pop-in">${pVal}</div>`;
                    else if (isActive) html += `<div class="py-2 text-indigo-700 target-highlight px-2 sm:px-3 rounded-lg">?</div>`;
                    else if (pVal === '') html += `<div class="py-2 text-transparent">_</div>`;
                });
                html += `</div></div>`;
                
                if (stepDef && stepDef.type === 'final') {
                    html += `<div class="mt-4 sm:mt-8 text-xl sm:text-3xl font-bold text-indigo-700 bg-indigo-50 px-4 sm:px-8 py-2 sm:py-3 rounded-2xl target-highlight shadow-inner text-center">Resultado = ?</div>`;
                }
            }

            // RENDER: FRACCIONES
            else if (currentState.topic.startsWith('frac_')) {
                html += `<div class="flex items-center gap-2 sm:gap-6 text-3xl sm:text-5xl font-bold font-fredoka text-slate-800 mt-4 w-full justify-center overflow-x-auto pb-4">`;
                html += `<div class="math-frac"><span>${d.n1}</span><div class="math-frac-line"></div><span>${d.d1}</span></div>`;
                
                let op = '=';
                if(currentState.topic==='frac_sum') op = '+';
                if(currentState.topic==='frac_mul') op = '×';
                if(currentState.topic==='frac_div') op = '÷';
                html += `<div class="text-indigo-600 bg-indigo-50 w-8 h-8 sm:w-12 sm:h-12 flex items-center justify-center rounded-full text-xl sm:text-3xl flex-shrink-0">${op}</div>`;
                
                if (currentState.topic !== 'frac_eq') {
                    html += `<div class="math-frac"><span>${d.n2}</span><div class="math-frac-line"></div><span>${d.d2}</span></div>`;
                    html += `<div class="text-indigo-600 text-xl sm:text-3xl flex-shrink-0">=</div>`;
                }

                let numDone = currentState.stepIndex > (currentState.topic==='frac_sum'? 1:0);
                let denDone = currentState.stepIndex > 0;
                if(currentState.topic === 'frac_eq') { numDone = true; denDone = true; } // Solo 1 paso
                
                let fNum = numDone ? `<span class="text-emerald-600 glow-success animate-pop-in">${d.nf || d.n2}</span>` : (stepDef && (stepDef.type==='num' || stepDef.type==='eq') ? `<span class="target-highlight px-2 sm:px-4 rounded-xl text-indigo-700 min-w-[2.5rem] sm:min-w-[3rem] inline-block">?</span>` : `<span class="text-slate-200">_</span>`);
                let fDen = denDone ? `<span class="text-emerald-600 glow-success animate-pop-in">${d.df || d.d2}</span>` : (stepDef && stepDef.type==='den' ? `<span class="target-highlight px-2 sm:px-4 rounded-xl text-indigo-700 min-w-[2.5rem] sm:min-w-[3rem] inline-block">?</span>` : `<span class="text-slate-200">_</span>`);
                
                html += `<div class="math-frac"><span>${fNum}</span><div class="math-frac-line"></div><span>${fDen}</span></div>`;
                html += `</div>`;
            }

            canvas.innerHTML = html;
        }

        // --- 6. VERIFICACIÓN Y FLUJO ---
        function verifyStep() {
            if (currentState.stepIndex >= currentState.steps.length) return;
            
            const inputEl = document.getElementById('answerInput');
            const inputVal = inputEl.value.trim();
            if (!inputVal) return;

            let stepDef = currentState.steps[currentState.stepIndex];
            let expectedStr = stepDef.expected.toString();
            let isCorrect = inputVal === expectedStr;

            // Flexibilidad en Multiplicación: Aceptar el producto completo o solo la unidad
            if (currentState.topic === 'col_mul' && stepDef.type === 'mul_digit') {
                 let fullProd = stepDef.expected + (stepDef.nextCarry * 10);
                 if (inputVal === fullProd.toString()) isCorrect = true;
            }

            if (isCorrect) {
                // Actualizar Modelo
                if (currentState.topic === 'col_mul') {
                    if (stepDef.type === 'mul_digit') {
                        if(stepDef.colIdx === -1) currentState.data.rows[stepDef.rowIdx][0] = stepDef.expected;
                        else currentState.data.rows[stepDef.rowIdx][stepDef.colIdx] = stepDef.expected;
                        if(stepDef.nextCarry > 0) currentState.data.carries[stepDef.colIdx] = stepDef.nextCarry;
                    } else if (stepDef.type === 'add_final') {
                        currentState.data.finalAns[stepDef.colIdx] = stepDef.expected;
                    }
                }
                else if (currentState.topic === 'col_div') {
                    if (stepDef.type === 'quo') currentState.data.qArr[stepDef.qIdx] = stepDef.expected;
                    if (stepDef.type === 'rem') currentState.data.residues.push({ sub: stepDef.sub, rem: stepDef.expected });
                }
                else if (currentState.topic === 'primos') {
                    if (stepDef.type === 'prime') currentState.data.grid[stepDef.row].right = stepDef.expected;
                    if (stepDef.type === 'quotient') {
                        currentState.data.grid[stepDef.row].left = stepDef.expected;
                        if(stepDef.expected > 1) currentState.data.grid.push({ left: stepDef.expected, right: '?' });
                    }
                }
                else if (currentState.topic === 'mcd' || currentState.topic === 'mcm') {
                    if (stepDef.type === 'prime') currentState.data.grid[stepDef.row].p = stepDef.expected;
                    if (stepDef.type === 'q1') currentState.data.grid[stepDef.row].c1 = stepDef.expected;
                    if (stepDef.type === 'q2') currentState.data.grid[stepDef.row].c2 = stepDef.expected;
                }

                currentState.stepIndex++;
                triggerStepBurst();
                
                if (currentState.stepIndex >= currentState.steps.length) finishProblem();
                else renderStep();
                
            } else {
                inputEl.classList.add('animate-shake', 'border-rose-400', 'bg-rose-50', 'text-rose-700');
                setTimeout(() => inputEl.classList.remove('animate-shake', 'border-rose-400', 'bg-rose-50', 'text-rose-700'), 400);
            }
            
            inputEl.value = ''; inputEl.focus();
        }

        function triggerStepBurst() {
            confetti({ particleCount: 20, spread: 40, origin: { y: 0.8 }, colors: ['#10B981', '#34D399'] });
        }

        function finishProblem() {
            renderStep();
            document.getElementById('inputContainer').classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
            
            let ptsGanados = currentState.difficulty === 'facil' ? 1 : (currentState.difficulty === 'medio' ? 2 : 3);
            studentData.puntos += ptsGanados;
            studentData.racha += 1;
            studentData.resueltos += 1;
            studentData.stats[currentState.topic] = (studentData.stats[currentState.topic] || 0) + 1;
            
            document.getElementById('rewardText').innerText = ptsGanados;
            actualizarUIEstudiante();
            guardarProgreso();
            
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 }, zIndex: 200 });
        }

        document.getElementById('answerInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') verifyStep();
        });

        window.onload = () => {
            if (studentData.expediente === '') document.getElementById('loginModal').classList.remove('hidden');
            else { actualizarUIEstudiante(); initProblem(); }
        };
    </script>
</body>
</html>
